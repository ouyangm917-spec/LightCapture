.record-button:hover{background:#fff0ed!important}.timer{font-variant-numeric:tabular-nums;font-size:11px;letter-spacing:.3px}.gif-time{font-size:10px;white-space:nowrap;padding:0 5px;font-variant-numeric:tabular-nums;color:#7e8d85}.gif-progress{width:90px;height:3px;accent-color:var(--green);margin:0 8px;cursor:pointer}.gif-label-button{height:32px;border-radius:4px;padding:0 10px;font-size:11px}.setting{margin-bottom:15px}.setting:last-child{margin-bottom:0}.setting label{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#84938a;margin-bottom:7px}.setting output{font-variant-numeric:tabular-nums;color:#5b7c67}.setting input[type=range]{width:100%;height:3px;accent-color:var(--green);margin:3px 0}.setting select{width:100%;height:30px;padding:0 7px;border:1px solid #dce6df;background:white;border-radius:4px;color:#61776a;font-size:11px}.setting-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.settings-summary{font-size:10px;color:#8da297;background:#f1f7f3;padding:8px;border-radius:4px;margin-top:4px}.gif-pointer{position:absolute;width:18px;height:23px;pointer-events:none;filter:drop-shadow(0 1px 1px #234d4535);left:30%;top:70%}.gif-pointer svg{display:block;width:100%;height:100%;fill:white;stroke:#32493c;stroke-width:1.3}.modal-backdrop{position:fixed;inset:0;background:#1b2c374d;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}.modal{width:330px;max-width:100%;background:white;box-shadow:0 16px 70px #182b3933;border:1px solid #e1e8e3;border-radius:9px;padding:22px;outline:none}.modal h2{font-size:16px;font-weight:600;margin-bottom:13px;display:flex;align-items:center;gap:9px}.modal h2 .icon{color:var(--green)}.modal p{font-size:11px;color:#87958c;line-height:1.9;margin-bottom:12px}.modal-info{background:#f2f7f3;border-radius:5px;padding:12px;font-size:11px;color:#66846e;line-height:2;margin:13px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin- <div class="desktop"><img id="desktop-image" alt="演示桌面：英文网页，仅为原型示例"></div>
<div class="capture-layer" id="capture-layer">
  <div class="selection" id="selection">
    <div class="size-label"><span id="selection-size">1000 × 620</span><small id="selection-mode"></small></div>
    <img id="capture-image" alt="选中的示例截图">
    <svg class="overlay" id="annotation-layer" viewBox="0 0 1000 620" aria-label="截图标注画布"></svg>
    <div class="gif-pointer hidden" id="gif-pointer"><svg viewBox="0 0 24 30"><path d="M3 2v23l6-6 5 9 4-2-5-9h9Z"/></svg></div>
    <i class="handle tl"></i><i class="handle tr"></i><i class="handle bl"></i><i class="handle br"></i><i class="handle tm"></i><i class="handle bm"></i><i class="handle ml"></i><i class="handle mr"></i>

</div>
<div class="picker-hint hidden" id="picker-hint">拖动鼠标，选择截图区域 <kbd>Esc 取消</kbd></div>
<div class="selection-preview hidden" id="selection-preview"></div>
<div class="actions" id="actions">
  <div class="toolbar" id="capture-toolbar" role="toolbar" aria-label="快捷截图工具栏">
    <button class="tool" data-tool="select" data-tip="选择 / 移动 · V" aria-label="选择或移动"><svg class="icon"><use href="#i-pointer"/></svg></button>
    <button class="tool" data-tool="rect" data-tip="矩形 · R" aria-label="矩形"><svg class="icon"><use href="#i-rect"/></svg></button>
    <button class="tool" data-tool="circle" data-tip="椭圆 · O" aria-label="椭圆"><svg class="icon"><use href="#i-circle"/></svg></button>
    <button class="tool" data-tool="arrow" data-tip="箭头 · A" aria-label="箭头"><svg class="icon"><use href="#i-arrow"/></svg></button>
    <button class="tool" data-tool="pen" data-tip="画笔 · P" aria-label="画笔"><svg class="icon"><use href="#i-pen"/></svg></button>
    <button class="tool" data-tool="mosaic" data-tip="马赛克 · M" aria-label="马赛克"><svg class="icon"><use href="#i-mosaic"/></svg></button>
    <button class="tool" data-tool="text" data-tip="文字 · T" aria-label="文字"><svg class="icon"><use href="#i-text"/></svg></button>
    <button class="tool" data-tool="step" data-tip="步骤标记 · S" aria-label="步骤标记"><svg class="icon"><use href="#i-step"/></svg></button>
    <span class="divider"></span>
    <button class="tool" id="undo-button" data-tip="撤销 · Ctrl Z" aria-label="撤销" disabled><svg class="icon"><use href="#i-undo"/></svg></button>
    <button class="tool" id="translate-button" data-tip="英译中" aria-label="英译中"><svg class="icon"><use href="#i-translate"/></svg></button>
    <button class="tool" id="gif-button" data-tip="录制 GIF" aria-label="录制 GIF"><svg class="icon"><use href="#i-video"/></svg></button>
    <span class="divider"></span>
    <button class="tool" id="save-button" data-tip="保存图片 · Ctrl S" aria-label="保存图片"><svg class="icon"><use href="#i-download"/></svg></button>
    <button class="tool cancel" id="cancel-button" data-tip="取消 · Esc" aria-label="取消截图"><svg class="icon"><use href="#i-close"/></svg></button>
    <button class="complete" id="complete-button" aria-label="完成并复制图片"><svg class="icon"><use href="#i-check"/></svg><span>完成</span><kbd>Enter</kbd></button>
  </div>
  <div class="toolbar hidden" id="record-toolbar" role="toolbar" aria-label="GIF 录制工具栏"><span class="gif-note"><span class="record-dot" id="record-dot"></span><span id="record-label">GIF 录制</span><small>示例演示</small></span><span class="divider"></span><button class="record-button" id="record-button"><svg class="icon"><use href="#i-play"/></svg><span>开始录制</span></button><button class="tool cancel" id="cancel-record" data-tip="返回截图" aria-label="返回截图"><svg class="icon"><use href="#i-close"/></svg></button></div>

  function render(){const el=elements.find(el=>el.id===selected),b=el&&bounds(el);$('#annotation-layer').innerHTML=overlayDefs+elements.map(nodeMarkup).join('')+(b?`<rect x="${b.x-5}" y="${b.y-5}" width="${b.w+10}" height="${b.h+10}" fill="none" stroke="#869f95" stroke-width="1" stroke-dasharray="4 4" pointer-events="none"/>`:'');$('#undo-button').disabled=!undoStack.length;}
  function syncStyles(){const el=elements.find(el=>el.id===selected);if(el){color=el.color;stroke=el.stroke;}$$('[data-color]').forEach(button=>button.classList.toggle('active',button.dataset.color===color));$$('[data-width]').forEach(button=>button.classList.toggle('active',Number(button.dataset.width)===stroke));}
  function setTool(next,showPalette=true){closePopovers();tool=next;if(next==='step'&&elements.find(el=>el.id===selected)?.type!=='step'){selected=null;render();}$$('[data-tool]').forEach(button=>button.classList.toggle('active',button.dataset.tool===next));$$('[data-width]').forEach((button,index)=>button.setAttribute('aria-label',(next==='step'?['小号步骤标记','标准步骤标记','大号步骤标记']:['细线','标准线宽','粗线'])[index]));$('#annotation-layer').classList.toggle('move-mode',next==='select');if(showPalette&&next!=='select'&&next!=='mosaic')$('#palette').classList.remove('hidden');}
  $$('[data-tool]').forEach(button=>button.addEventListener('click',()=>setTool(button.dataset.tool)));
  $$('[data-color]').forEach(button=>button.addEventListener('click',()=>{color=button.dataset.color;const el=elements.find(el=>el.id===selected);if(el&&el.color!==color){commit();el.color=color;render();}syncStyles();}));
  $$('[data-width]').forEach(button=>button.addEventListener('click',()=>{stroke=Number(button.dataset.width);const el=elements.find(el=>el.id===selected);if(el&&el.stroke!==stroke){commit();el.stroke=stroke;render();}syncStyles();}));
  function point(event){const rect=$('#annotation-layer').getBoundingClientRect();return[Math.max(0,Math.min(imageWidth,(event.clientX-rect.left)/rect.width*imageWidth)),Math.max(0,Math.min(imageHeight,(event.clientY-rect.top)/rect.height*imageHeight))];}
  $('#annotation-layer').addEventListener('pointerdown',event=>{if(mode!=='capture'||picking||event.button!==0)return;event.stopPropagation();closePopovers();const[x,y]=point(event);if(tool==='select'){const hit=elements.slice().reverse().find(el=>{const b=bounds(el);return x>=b.x-7&&x<=b.x+b.w+7&&y>=b.y-7&&y<=b.y+b.h+7;});selected=hit?.id??null;if(hit)gesture={kind:'move',id:hit.id,x,y,original:structuredClone(hit),before:snapshot()};render();syncStyles();}else if(tool==='step'){const number=nextStepNumber();commit();selected=nextId++;elements.push({id:selected,type:'step',x,y,w:0,h:0,color,stroke,number});render();return;}else if(tool==='text'){textPoint=[x,y];$('#text-editor').classList.remove('hidden');$('#annotation-text').value='';$('#annotation-text').focus();return;}else{const before=snapshot();selected=nextId++;const el={id:selected,type:tool,x,y,w:0,h:0,color,stroke};if(tool==='pen')el.points=[[x,y]];elements.push(el);gesture={kind:'draw',id:selected,x,y,before};render();}if(gesture)$('#annotation-layer').setPointerCapture(event.pointerId);});
  $('#annotation-layer').addEventListener('pointermove',event=>{if(!gesture)return;const[x,y]=point(event),el=elements.find(item=>item.id===gesture.id);if(!el)return;if(gesture.kind==='draw'){el.w=x-gesture.x;el.h=y-gesture.y;if(el.type==='pen')el.points.push([x,y]);}else{const dx=x-gesture.x,dy=y-gesture.y;el.x=gesture.original.x+dx;el.y=gesture.original.y+dy;if(el.type==='pen')el.points=gesture.original.points.map(p=>[p[0]+dx,p[1]+dy]);}render();});
  function endGesture(cancel=false){if(!gesture)return;const el=elements.find(item=>item.id===gesture.id),b=el&&bounds(el);if(cancel||(gesture.kind==='draw'&&b&&b.w<4&&b.h<4)){elements=gesture.before.elements;selected=gesture.before.selected;}else if(JSON.stringify(elements)!==JSON.stringify(gesture.before.elements))commit(gesture.before);gesture=null;render();}
  $('#annotation-layer').addEventListener('pointerup',()=>endGesture());$('#annotation-layer').addEventListener('pointercancel',()=>endGesture(true));
  $('#text-editor').addEventListener('submit',event=>{event.preventDefault();const text=$('#annotation-text').value.trim();if(!text||!textPoint)return;commit();selected=nextId++;elements.push({id:selected,type:'text',x:textPoint[0],y:textPoint[1],w:0,h:0,text,color,stroke});closePopovers();render();$('#complete-button').focus();});
  function deleteSelected(){if(selected===null)return;commit();elements=elements.filter(el=>el.id!==selected);selected=null;render();}
  $('#undo-button').addEventListener('click',undo);$('#cancel-button').addEventListener('click',hideCapture);$('#launch-capture').addEventListener('click',()=>beginPicking());$('#launch-gif').addEventListener('click',()=>beginPicking('record'));
  async function imageBlob(){const source=$('#capture-image');if(!source.complete||!source.naturalWidth)await source.decode();const canvas=document.createElement('canvas');canvas.width=imageWidth;canvas.height=imageHeight;const ctx=canvas.getContext('2d');if(!ctx)throw Error('canvas');ctx.drawImage(source,0,0,imageWidth,imageHeight);const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${imageWidth}" height="${imageHeight}" viewBox="0 0 ${imageWidth} ${imageHeight}">${overlayDefs}${elements.map(nodeMarkup).join('')}</svg>`,drawing=new Image();drawing.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await drawing.decode();ctx.drawImage(drawing,0,0);return new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(Error('encode')),'image/png'));}
  async function saveImage(){try{const blob=await imageBlob(),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='轻截-截图.png';link.click();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('截图已保存为 PNG');}catch(error){toast('导出失败，请重试');}}
  async function completeCapture(){if(mode!=='capture'||picking)return;try{if(!navigator.clipboard?.write||!window.ClipboardItem){toast('浏览器不支持复制图片，可点击下载图标保存');return;}$('#complete-button').disabled=true;await navigator.clipboard.write([new ClipboardItem({'image/png':imageBlob()})]);hideCapture();toast('已复制，回到聊天窗口按 Ctrl + V 粘贴');}catch(error){toast('浏览器未允许复制，可点击下载图标保存图片');}finally{$('#complete-button').disabled=false;}}
  $('#save-button').addEventListener('click',saveImage);$('#complete-button').addEventListener('click',completeCapture);
  $('#translate-button').addEventListener('click',()=>{showPopover('#translation-popover');$('#translate-button').classList.toggle('active',!$('#translation-popover').classList.contains('hidden'));});
  $('#copy-translation').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('#translation-text').textContent);closePopovers();toast('译文已复制');}catch(error){const range=document.createRange();range.selectNodeContents($('#translation-text'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('译文已选中，请按 Ctrl + C 复制');}});
  $('#gif-button').addEventListener('click',()=>setMode('record'));$('#cancel-record').addEventListener('click',()=>setMode('capture'));$('#close-gif').addEventListener('click',()=>setMode('capture'));
  function setPlaying(next){gifPlaying=next;$('#play-button').innerHTML=icon(next?'pause':'play');$('#play-button').setAttribute('aria-label',next?'暂停 GIF 预览':'播放 GIF 预览');}
  function updateGif(){if(gifTime<trimStart||gifTime>trimEnd)gifTime=trimStart;$('#trim-start-value').textContent=trimStart.toFixed(1)+'s';$('#trim-end-value').textContent=trimEnd.toFixed(1)+'s';$('#gif-summary').textContent='播放 '+((trimEnd-trimStart)/gifSpeed).toFixed(1)+' 秒 · 循环播放';updatePlayback();}
  function updatePlayback(){$('#gif-time').textContent=gifTime.toFixed(1)+' / '+gifDuration.toFixed(1)+'s';$('#playhead').value=gifTime;const p=gifTime/Math.max(gifDuration,.5);$('#gif-pointer').style.left=(28+Math.sin(p*Math.PI*2)*23)+'%';$('#gif-pointer').style.top=(71-Math.sin(p*Math.PI)*28)+'%';}
  function stopRecording(){if(!recording)return;gifDuration=Math.max(.5,Math.min(8,recordElapsed));gifDuration=Math.round(gifDuration*10)/10;gifTime=0;trimStart=0;trimEnd=gifDuration;$('#trim-start').max=Math.max(0,gifDuration-.5);$('#trim-start').value=0;$('#trim-end').max=gifDuration;$('#trim-end').value=gifDuration;$('#playhead').max=gifDuration;setMode('preview');updateGif();toast('演示录制已结束，可预览、修剪后导出');}
  $('#record-button').addEventListener('click',()=>{if(recording){stopRecording();return;}recording=true;recordElapsed=0;gifTime=0;gifDuration=8;$('#record-dot').classList.add('running');$('#record-label').textContent='00:00.0';$('#record-button').innerHTML='<span class="record-stop"></span><span>停止录制</span>';toast('正在演示录制，8 秒后自动停止');});
  $('#play-button').addEventListener('click',()=>{if(gifTime>=trimEnd)gifTime=trimStart;setPlaying(!gifPlaying);});$('#playhead').addEventListener('input',event=>{setPlaying(false);gifTime=Math.max(trimStart,Math.min(trimEnd,Number(event.target.value)));updatePlayback();});
  $('#gif-settings-button').addEventListener('click',()=>{showPopover('#gif-settings');$('#gif-settings-button').classList.toggle('active',!$('#gif-settings').classList.contains('hidden'));});
  $('#trim-start').addEventListener('input',event=>{trimStart=Math.min(Number(event.target.value),trimEnd-.5);event.target.value=trimStart;updateGif();});$('#trim-end').addEventListener('input',event=>{trimEnd=Math.max(Number(event.target.value),trimStart+.5);event.target.value=trimEnd;updateGif();});$('#gif-speed').addEventListener('change',event=>{gifSpeed=Number(event.target.value);updateGif();});
  setInterval(()=>{const now=performance.now(),dt=Math.min((now-lastTick)/1000,.2);lastTick=now;if(recording){recordElapsed+=dt;gifTime=Math.min(recordElapsed,8);$('#record-label').textContent='00:'+Math.floor(gifTime).toString().padStart(2,'0')+'.'+Math.floor(gifTime%1*10);updatePlayback();if(recordElapsed>=8)stopRecording();}else if(gifPlaying&&mode==='preview'&&!document.hidden){gifTime+=dt*gifSpeed;if(gifTime>=trimEnd)gifTime=trimStart;updatePlayback();}},50);
  function openModal(title,body,actions){returnFocus=document.activeElement;$('#modal-heading').innerHTML=icon('crop')+escapeXml(title);$('#modal-body').innerHTML=body;$('#modal-actions').innerHTML='';actions.forEach(action=>{const button=document.createElement('button');button.className='button'+(action.primary?' primary':'');button.textContent=action.label;button.addEventListener('click',action.action);$('#modal-actions').appendChild(button);});$('#modal-backdrop').classList.remove('hidden');$('.modal').focus();}
  function closeModal(){const wasOpen=!$('#modal-backdrop').classList.contains('hidden');$('#modal-backdrop').classList.add('hidden');if(wasOpen)returnFocus?.focus();}
  $('#modal-backdrop').addEventListener('click',event=>{if(event.target===$('#modal-backdrop'))closeModal();});
  $('#export-gif').addEventListener('click',()=>{setPlaying(false);closePopovers();const width=Number($('#gif-size').value),height=Math.round(width*imageHeight/imageWidth);openModal('GIF 导出预览','<div class="modal-info">'+width+' × '+height+' px · '+((trimEnd-trimStart)/gifSpeed).toFixed(1)+' 秒<br>'+gifSpeed+'× 速度 · 循环播放</div><p>当前是静态交互原型，导出流程在这里结束。正式桌面版将在这里生成 GIF 文件。</p>',[{label:'继续调整',action:closeModal},{label:'知道了',primary:true,action:closeModal}]);});
  $('#help-button').addEventListener('click',()=>openModal('截图，就这么简单','<p><kbd>Alt + A</kbd> 框选 → 标注 → <kbd>Enter</kbd> 复制 → 粘贴。</p><p>工具栏包含常用标注、英译中和 GIF。颜色、线宽和 GIF 调整只在需要时展开。</p><div class="modal-info">可用：框选示例画面、拖入图片、标注、撤销、复制与保存 PNG。<br>快捷键仅在本页面内有效；实际屏幕捕获、OCR、翻译接口与 GIF 编码尚未接入。</div><p>撤销 <kbd>Ctrl Z</kbd> · 重做 <kbd>Ctrl Y</kbd><br>取消 <kbd>Esc</kbd> · 保存 <kbd>Ctrl S</kbd></p>',[{label:'知道了',primary:true,action:closeModal}]));
  function loadImage(file){if(!file||!file.type.startsWith('image/')){toast('请拖入一张图片');return;}if(file.size>25*1024*1024){toast('请选择 25 MB 以内的图片');return;}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{imageWidth=img.naturalWidth;imageHeight=img.naturalHeight;$('#capture-image').src=reader.result;$('#annotation-layer').setAttribute('viewBox',`0 0 ${imageWidth} ${imageHeight}`);const scale=Math.min(1,(innerWidth-80)/imageWidth,(innerHeight-180)/imageHeight);elements=[];selected=null;undoStack=[];redoStack=[];active=true;picking=false;$('#capture-layer').classList.remove('hidden','picking');$('#selection').classList.remove('hidden');$('#actions').classList.remove('hidden');$('#launcher').classList.add('hidden');$('#picker-hint').classList.add('hidden');$('#bottom-hint').classList.remove('hidden');setMode('capture');setCrop({x:(innerWidth-imageWidth*scale)/2,y:Math.max(40,(innerHeight-imageHeight*scale)/2-30),w:imageWidth*scale,h:imageHeight*scale});setTool('select',false);render();toast('图片已载入，可以直接标注');};img.onerror=()=>toast('无法打开这张图片');img.src=reader.result;};reader.readAsDataURL(file);}
  document.addEventListener('dragover',event=>{event.preventDefault();if(event.dataTransfer.types.includes('Files'))$('#drag-message').classList.remove('hidden');});document.addEventListener('dragleave',event=>{if(!event.relatedTarget)$('#drag-message').classList.add('hidden');});document.addEventListener('drop',event=>{event.preventDefault();$('#drag-message').classList.add('hidden');loadImage(event.dataTransfer.files[0]);});
  document.addEventListener('paste',event=>{if(/^(INPUT|TEXTAREA)$/.test(event.target.tagName))return;const item=[...(event.clipboardData?.items||[])].find(item=>item.type.startsWith('image/'));if(item){event.preventDefault();loadImage(item.getAsFile());}});
  document.addEventListener('keydown',event=>{const key=event.key.toLowerCase();if(!$('#modal-backdrop').classList.contains('hidden')){if(key==='escape'){event.preventDefault();closeModal();}if(key==='tab'){const buttons=$$('button',$('.modal')),first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===$('.modal'))){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}return;}if(event.altKey&&key==='a'){event.preventDefault();beginPicking();return;}if(key==='escape'){event.preventDefault();const open=$$('.popover').some(el=>!el.classList.contains('hidden'));if(open)closePopovers();else hideCapture();return;}if(/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName))return;if(!active||picking)return;if((event.ctrlKey||event.metaKey)&&mode==='capture'){if(key==='z'){event.preventDefault();event.shiftKey?redo():undo();}if(key==='y'){event.preventDefault();redo();}if(key==='s'){event.preventDefault();saveImage();}return;}if(mode==='capture'){if(key==='enter'){event.preventDefault();completeCapture();}if(key==='delete'||key==='backspace'){event.preventDefault();deleteSelected();}const shortcuts={v:'select',r:'rect',o:'circle',a:'arrow',p:'pen',t:'text',m:'mosaic',s:'step'};if(shortcuts[key])setTool(shortcuts[key]);}if(mode==='preview'&&event.code==='Space'){event.preventDefault();setPlaying(!gifPlaying);}});
  let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{buildDesktop();if(active&&!picking){const scale=Math.min(1,(innerWidth-70)/imageWidth,(innerHeight-180)/imageHeight);setCrop({x:(innerWidth-imageWidth*scale)/2,y:Math.max(40,(innerHeight-imageHeight*scale)/2-34),w:imageWidth*scale,h:imageHeight*scale});}},100);});
  buildDesktop();setCrop(defaultCrop);setTool('select',false);render();updateGif();
</script>
